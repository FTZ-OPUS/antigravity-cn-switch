name: Build Mac & Windows Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Standalone Windows Exe
        shell: pwsh
        run: ./windows/build_win.ps1

      - name: Smoke Test Standalone Windows Exe & Fresh PC Install
        shell: pwsh
        run: |
          $ExePath = (Resolve-Path "dist/AntigravityCnSwitch-Windows/反重力汉化开关.exe").Path
          $sizeMB = [math]::Round((Get-Item $ExePath).Length / 1MB, 2)
          Write-Host "Standalone exe size: $sizeMB MB"
          if ($sizeMB -lt 20) { throw "Exe unexpectedly small ($sizeMB MB) - embedded payload missing?" }
          $proc = Start-Process -FilePath $ExePath -PassThru
          Start-Sleep -Seconds 3
          if ($proc.HasExited) {
            throw "Windows app exited prematurely with code $($proc.ExitCode)"
          }
          Write-Host "Standalone Windows GUI launched and stayed alive (PID $($proc.Id))"
          Stop-Process -Id $proc.Id -Force

          # Verify shortcut patching logic on Windows Desktop .lnk
          $wsh = New-Object -ComObject WScript.Shell
          $testLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Antigravity.lnk'
          $sc = $wsh.CreateShortcut($testLnk)
          $sc.TargetPath = "$env:LOCALAPPDATA\Programs\antigravity\Antigravity.exe"
          $sc.Save()
          $sc2 = $wsh.CreateShortcut($testLnk)
          if ($sc2.TargetPath -match 'Antigravity(\.exe|$)') {
            $sc2.Arguments = ($sc2.Arguments + ' --remote-debugging-port=9222').Trim()
            $sc2.Save()
          }
          $sc3 = $wsh.CreateShortcut($testLnk)
          if ($sc3.Arguments -notmatch '--remote-debugging-port=9222') { throw "Shortcut patch test failed!" }
          Write-Host "Shortcut patch verified: $($sc3.Arguments)"
          Remove-Item -Force $testLnk

          # Simulate fresh Windows PC: ensure .antigravity/argv.json gets created and patch install/uninstall succeed
          $HomeDir = $env:USERPROFILE
          New-Item -ItemType Directory -Force -Path (Join-Path $HomeDir ".antigravity") | Out-Null
          $CacheNode = (Resolve-Path ".cache/node.exe").Path
          & $CacheNode --disable-warning=ExperimentalWarning "patch/install.mjs" install
          $ArgvPath = Join-Path $HomeDir ".antigravity\argv.json"
          if (-not (Test-Path $ArgvPath)) { throw "argv.json was not created on fresh Windows PC!" }
          Write-Host "argv.json created: $(Get-Content $ArgvPath -Raw)"
          & $CacheNode --disable-warning=ExperimentalWarning "patch/install.mjs" uninstall

      - name: Upload Windows Standalone Exe
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityCnSwitch-Windows-Exe
          path: dist/AntigravityCnSwitch-Windows/反重力汉化开关.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS App (arm64)
        run: |
          chmod +x ./mac/build_mac.sh
          ./mac/build_mac.sh arm64
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "反重力汉化开关.app" "AntigravityCnSwitch-macOS-arm64.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityCnSwitch-macOS-arm64
          path: dist/AntigravityCnSwitch-macOS-arm64.zip
